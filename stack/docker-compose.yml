# Moonlight Oil — one small library that runs on Dad's PC.
#
# This single stack runs everything behind one friendly home page:
#   - Storyteller : reads your ebooks and audiobooks in sync (fully self-hosted)
#   - Home        : a big-button landing page that ties it together
#   - FlowState   : self-hosted focus reader (built from source on first run)
#
# It works the same whether Docker or Podman is installed. The launcher script
# picks whichever runtime is present and runs `compose` against this file.
#
# Nothing here needs editing by hand. The installer generates the `.env` file
# (secret key, ports) on first run.

services:
  # -------------------------------------------------------------------------
  # Home page — the ONE thing Dad opens. Big buttons, large text.
  #
  # Caddy serves ./home and does two small jobs the page can't do for itself:
  # it publishes the real ports at /config.json, and it proxies /up/<service>
  # so the page can tell whether a service is awake before Dad clicks it.
  # See ./caddy/Caddyfile.
  # -------------------------------------------------------------------------
  home:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-8080}:80"
    environment:
      # Baked into /config.json so the page always points at the right ports,
      # even if these were changed to dodge a conflict on this PC.
      HOME_PORT: "${HOME_PORT:-8080}"
      STORYTELLER_PORT: "${STORYTELLER_PORT:-8001}"
      FLOWSTATE_PORT: "${FLOWSTATE_PORT:-8003}"
      # The PC's address on the home network. The launcher fills this in; it's
      # what the "read on your tablet" QR code points at.
      LAN_HOST: "${LAN_HOST:-}"
    volumes:
      - ./home:/usr/share/caddy:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/config.json"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - library

  # -------------------------------------------------------------------------
  # Storyteller — sync your ebooks with their audiobook narration.
  # Real, documented self-hosting image:
  #   https://storyteller-platform.dev/docs/installation/self-hosting/
  # -------------------------------------------------------------------------
  storyteller:
    image: registry.gitlab.com/storyteller-platform/storyteller:latest
    restart: unless-stopped
    ports:
      - "${STORYTELLER_PORT:-8001}:8001"
      - "${READIUM_PORT:-8002}:8002"
    environment:
      # Generated by the installer on first run and stored in .env.
      STORYTELLER_SECRET_KEY: "${STORYTELLER_SECRET_KEY:?The installer must generate this. Run the launcher, do not start by hand.}"
      READIUM_PORT: "${READIUM_PORT:-8002}"
      # Run as a normal desktop user, not root.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      STORYTELLER_LOG_LEVEL: "${STORYTELLER_LOG_LEVEL:-info}"
    volumes:
      - ./data/storyteller:/data:rw
    networks:
      - library

  # -------------------------------------------------------------------------
  # FlowState Reader — a calm, distraction-free focus reader.
  # Self-hosted by building the open-source web app from source:
  #   https://github.com/PeggyZWY/flowstate-webapp
  # It is a static frontend (no backend), so this just builds and serves it.
  # The first launch compiles it once (a few minutes); after that it's instant.
  # -------------------------------------------------------------------------
  flowstate:
    build:
      context: ./flowstate
      args:
        FLOWSTATE_REF: "${FLOWSTATE_REF:-master}"
    image: moonlight-oil-flowstate:local
    restart: unless-stopped
    ports:
      - "${FLOWSTATE_PORT:-8003}:80"
    networks:
      - library

networks:
  library:
    driver: bridge
