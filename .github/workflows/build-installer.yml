name: Build installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .exe to a release on tags

jobs:
  # Compile the Inno Setup script into MoonlightOilSetup.exe.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\moonlight-oil.iss
          if (-not (Test-Path "dist\MoonlightOilSetup.exe")) { throw "Installer was not produced." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightOilSetup
          path: dist/MoonlightOilSetup.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoonlightOilSetup.exe

  # Smoke-test that FlowState Reader actually builds from source, so the
  # self-hosted image is never silently broken.
  flowstate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FlowState image
        run: docker build -t moonlight-oil-flowstate:ci stack/flowstate
